name: PR validation

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check issue reference
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$BODY" | grep -qiE \
            '(closes|fixes|resolves) #[0-9]+'; then
            echo "PR body must contain Closes/Fixes/Resolves #N"
            exit 1
          fi

      - name: Check linked issue is approved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          NUMBER=$(printf '%s' "$BODY" | grep -oiE \
            '(closes|fixes|resolves) #[0-9]+' | head -1 | grep -oE '[0-9]+')
          if [ -z "$NUMBER" ]; then echo "no issue number found"; exit 1; fi
          if ! gh issue view "$NUMBER" --json labels \
            --jq '.labels[].name' | grep -qx 'status:approved'; then
            echo "issue #$NUMBER lacks the status:approved label"
            exit 1
          fi

      - name: Check exactly one type label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          COUNT=$(gh pr view "$PR" --json labels \
            --jq '[.labels[].name | select(startswith("type:"))] | length')
          if [ "$COUNT" != "1" ]; then
            echo "PR must carry exactly one type:* label (found $COUNT)"
            exit 1
          fi

      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          PATTERN='^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)'
          PATTERN="$PATTERN/[a-z0-9._-]+$"
          if ! printf '%s' "$BRANCH" | grep -qE "$PATTERN"; then
            echo "branch '$BRANCH' must match type/description (lowercase)"
            exit 1
          fi

      - name: Check conventional commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --json commits \
            --jq '.commits[].messageHeadline' | while IFS= read -r subject; do
            case "$subject" in
              # GitHub merge commits never follow convention; the PR's own commits do
              "Merge "*) continue ;;
            esac
            CCPAT='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)'
            CCPAT="$CCPAT(\\([a-z0-9._-]+\\))?!?: .+"
            if ! printf '%s' "$subject" | grep -qE "$CCPAT"; then
              echo "non-conventional subject: $subject"
              exit 1
            fi
          done
