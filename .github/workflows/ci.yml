name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pinned 1.27.0, but GOTOOLCHAIN auto-switches to the 1.27.3
          # toolchain from the shared module cache, whose stdlib exports (v5)
          # need golangci-lint >= v2.14.0 (pinned v2.15.0 below).
          go-version: "1.27.0"
          cache: false
          # No cache save: the cache-upload post-job hangs from this
          # network; the repo builds in seconds without it.

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt reports unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --timeout=5m
